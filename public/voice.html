<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Call Ada — Wholesale Sales</title>
    <link rel="stylesheet" href="/voice.css" />
  </head>
  <body data-state="idle">
    <main class="phone">
      <div class="screen">
        <div class="caller">
          <div class="avatar" id="avatar">A</div>
          <div class="name">Ada</div>
          <div class="role">Wholesale Sales Agent</div>
          <div class="timer" id="timer">Ready to call</div>
          <div class="statepill" id="status">Idle</div>
          <div class="meter" title="mic level vs. speech gate">
            <div class="meter-fill" id="meter"></div>
            <div class="meter-tick" id="meterMark"></div>
          </div>
        </div>

        <p class="caption" id="partial"></p>
        <div class="transcript" id="log" aria-live="polite"></div>
      </div>

      <div class="actions">
        <button class="callbtn call" id="toggle" type="button" aria-label="Call">
          <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
            <path fill="currentColor" d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.6c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.3 1z"/>
          </svg>
        </button>
      </div>
    </main>
    <script src="/voice.js"></script>
  </body>
</html>
