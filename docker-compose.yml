services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
      POSTGRES_DB: sales
    # Uncomment to inspect Postgres from the host (may conflict with a local pg):
    # ports:
    #   - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Uncomment to inspect Redis from the host (may conflict with a local redis):
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://sales:sales@db:5432/sales
      REDIS_URL: redis://redis:6379/0
      # Provide your key later: `export ANTHROPIC_API_KEY=sk-ant-...` before `docker compose up`
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5}
      MAX_TOKENS: ${MAX_TOKENS:-4096}
    ports:
      - "8000:8000"

volumes:
  pgdata:
